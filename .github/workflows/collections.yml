name: Collections

# Every edit to the curated content is validated here and the files the app
# downloads are rebuilt from source. A malformed list fails this check instead of
# reaching the app, where it used to fail silently.
on:
  push:
    paths:
      - 'collections/**'
      - '.github/workflows/collections.yml'
  pull_request:
    paths:
      - 'collections/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate and build
        run: python3 collections/build.py

      # Only on a real push to a branch — a pull request builds to prove the
      # content is sound, but must not write to the contributor's branch.
      - name: Commit the built files
        if: github.event_name == 'push'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add collections/index.json collections/all.json
          if git diff --staged --quiet; then
            echo "Nothing to rebuild."
          else
            git commit -m "Rebuild collections [skip ci]"
            git push
          fi
